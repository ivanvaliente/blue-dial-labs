<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-labelledby="title desc">
  <title id="title">WristOwl mark</title>
  <desc id="desc">A technical owl with data-driven eyes and circuit-detail wings inside a three-ring watch dial with five-minute indices.</desc>

  <!-- Shared Blue Dial Labs product-family dial chassis -->
  <g fill="none" stroke="#2d6f98" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="80" cy="80" r="72" stroke-width="2.8"/>
    <circle cx="80" cy="80" r="67" stroke-width="1.5"/>
    <circle cx="80" cy="80" r="60" stroke-width="1.5"/>
    <g stroke-width="2.1" stroke-linecap="square">
      <path d="M80 15v3"/>
      <path d="M80 15v3" transform="rotate(30 80 80)"/>
      <path d="M80 15v3" transform="rotate(60 80 80)"/>
      <path d="M80 15v3" transform="rotate(90 80 80)"/>
      <path d="M80 15v3" transform="rotate(120 80 80)"/>
      <path d="M80 15v3" transform="rotate(150 80 80)"/>
      <path d="M80 15v3" transform="rotate(180 80 80)"/>
      <path d="M80 15v3" transform="rotate(210 80 80)"/>
      <path d="M80 15v3" transform="rotate(240 80 80)"/>
      <path d="M80 15v3" transform="rotate(270 80 80)"/>
      <path d="M80 15v3" transform="rotate(300 80 80)"/>
      <path d="M80 15v3" transform="rotate(330 80 80)"/>
    </g>
  </g>

  <!-- Owl silhouette: angular, technical, deliberately non-mascot -->
  <g fill="none" stroke="#102c3f" stroke-linecap="round" stroke-linejoin="round">
    <path d="M47 58 60 47 72 53 80 47 88 53 100 47 113 58 106 69 110 83 103 99 91 112 80 119 69 112 57 99 50 83 54 69Z" stroke-width="3.2"/>
    <path d="M51 61 64 56 80 62 96 56 109 61" stroke-width="2.5"/>
    <path d="M57 94 47 103 61 103 56 113 70 108" stroke-width="2.7"/>
    <path d="M103 94 113 103 99 103 104 113 90 108" stroke-width="2.7"/>
    <path d="M80 62v14" stroke-width="2.2"/>
  </g>

  <!-- Angular eye sockets -->
  <g fill="none" stroke="#2d6f98" stroke-linejoin="round">
    <path d="M51 68 61 59 74 63 72 76 63 82 53 77Z" stroke-width="2.4"/>
    <path d="M109 68 99 59 86 63 88 76 97 82 107 77Z" stroke-width="2.4"/>
  </g>

  <!-- Gear/data eyes -->
  <g fill="none" stroke="#2d6f98" stroke-linecap="square">
    <circle cx="63.5" cy="70.5" r="7.5" stroke-width="2.2"/>
    <circle cx="96.5" cy="70.5" r="7.5" stroke-width="2.2"/>
    <g stroke-width="1.9">
      <path d="M63.5 60v3"/><path d="M63.5 78v3"/>
      <path d="M53 70.5h3"/><path d="M71 70.5h3"/>
      <path d="M56 63l2.3 2.3"/><path d="M68.7 75.7 71 78"/>
      <path d="M56 78l2.3-2.3"/><path d="M68.7 65.3 71 63"/>
      <path d="M96.5 60v3"/><path d="M96.5 78v3"/>
      <path d="M86 70.5h3"/><path d="M104 70.5h3"/>
      <path d="M89 63l2.3 2.3"/><path d="M101.7 75.7 104 78"/>
      <path d="M89 78l2.3-2.3"/><path d="M101.7 65.3 104 63"/>
    </g>
  </g>

  <g fill="#102c3f">
    <path d="M63.5 65.5 68.5 70.5 63.5 75.5 58.5 70.5Z"/>
    <path d="M96.5 65.5 101.5 70.5 96.5 75.5 91.5 70.5Z"/>
  </g>
  <g fill="#f3f0e8">
    <circle cx="63.5" cy="70.5" r="1.7"/>
    <circle cx="96.5" cy="70.5" r="1.7"/>
  </g>

  <!-- Beak / decision pointer -->
  <path d="M80 76 85 83 80 92 75 83Z" fill="#2d6f98"/>

  <!-- Circuit / network detail in wings and body -->
  <g fill="none" stroke="#2d6f98" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M55 84h8v8h8v9h5"/>
    <path d="M105 84h-8v8h-8v9h-5"/>
    <path d="M58 96h6v7"/>
    <path d="M102 96h-6v7"/>
    <path d="M80 94v15"/>
  </g>
  <g fill="#2d6f98">
    <circle cx="55" cy="84" r="1.9"/><circle cx="63" cy="92" r="1.9"/>
    <circle cx="71" cy="101" r="1.9"/><circle cx="76" cy="101" r="1.9"/>
    <circle cx="105" cy="84" r="1.9"/><circle cx="97" cy="92" r="1.9"/>
    <circle cx="89" cy="101" r="1.9"/><circle cx="84" cy="101" r="1.9"/>
    <circle cx="58" cy="96" r="1.8"/><circle cx="64" cy="103" r="1.8"/>
    <circle cx="102" cy="96" r="1.8"/><circle cx="96" cy="103" r="1.8"/>
    <circle cx="80" cy="109" r="2"/>
  </g>
</svg>